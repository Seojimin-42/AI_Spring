spring.application.name=demo2

server.port=8080

spring.ai.model.chat=openai
spring.ai.model.embedding=ollama

spring.ai.openai.api-key=${OPEN_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-120b

spring.ai.ollama.base.url=http://localhost:11434
spring.ai.ollama.embedding.options.model=bge-m3

spring.datasource.url=jdbc:postgresql://10.200.72.32:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.ai.vectorstore.pgvector.initialize-schema=true