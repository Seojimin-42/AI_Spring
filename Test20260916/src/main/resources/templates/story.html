<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 스토리텔러</title>

    <link rel="stylesheet" href="/css/story.css">
    <script src="/js/story.js" defer></script>
</head>
<body>
    <h1>📖 실시간 스토리텔러</h1>
    <p>어떤 이야기를 만들어볼까요?</p>

    <input
        type="text"
        id="topic"
        placeholder="이야기의 주제를 입력하세요."
    >

    <button id="storyButton">
        이야기를 만들기
    </button>

    <h2>생성된 이야기</h2>

    <div id="storyResult"></div>
</body>
</html>
